<body class="flex flex-col items-center justify-center p-3 sm:p-6 text-slate-800">

        </main>

        <!-- Footer -->

            Reading Booster High School English Vocabulary Challenge • 10-Second Speed Quiz

    <!-- Teacher Monitoring Modal -->
    <div id="teacherModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 max-w-2xl w-full shadow-2xl border-4 border-indigo-200 max-h-[90vh] flex flex-col">

                    </div>
                </div>
                <button onclick="app.closeTeacherModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>

                    <i class="fa-solid fa-rotate-right"></i> 전체 기록 초기화
                </button>
            </div>
        </div>
    </div>

    <script>
        const PASSAGE_SETS = [
            {
                setId: 1,
                setTitle: "Set 1: 인문 & 과학 (Passages 20, 21, 22)",
                badgeColor: "from-amber-400 to-orange-500",
                passages: [
                    {
                        id: "20",
                        title: "20번: 경제학과 공감 (Empathy in Economics)",
                        summary: "경제학은 수치나 논리 외에 감정이입(empathy)과 따뜻한 마음이 결합되어 인간의 삶을 개선해야 한다는 지문입니다.",
                        words: [
                            { word: "empathy", meaning: "공감, 감정이입", options: ["공감, 감정이입", "통계, 수치", "논리적 분석", "경제적 빈곤"], hint: "A good economist also needs empathy." },
                            { word: "compassion", meaning: "동정심, 연민", options: ["경쟁심", "동정심, 연민", "이기심", "냉철함"], hint: "It is compassion that pushes us to solve them." },
                            { word: "combine A with B", meaning: "A와 B를 결합하다", options: ["A와 B를 결합하다", "A와 B를 비교하다", "A에서 B를 제외하다", "A와 B를 분리하다"], hint: "Economists need to combine a cold head with a warm heart." },
                            { word: "risk -ing", meaning: "~할 위험이 있다", options: ["~을 보장하다", "~을 즉시 중단하다", "~할 위험이 있다", "~을 적극 권장하다"], hint: "Economic decisions risk becoming disconnected." },
                            { word: "disconnected", meaning: "단절된, 연관성이 없는", options: ["단절된", "밀접한", "복잡한", "통합된"], hint: "Risk becoming disconnected from the people." }
                        ]
                    },
                    {
                        id: "21",
                        title: "21번: 스키마와 기억의 왜곡 (Schema & Memory)",
                        summary: "익숙한 상황에 대한 정신적 구조인 스키마(schema)로 인해 실제로 보지 않은 세부사항까지 뇌가 채워 넣어 기억한다는 내용입니다.",
                        words: [
                            { word: "schema", meaning: "도식, 개요 (경험적 틀)", options: ["실험 결과", "도식, 개요 (경험적 틀)", "직접적 증거", "학술적 논문"], hint: "A mental structure, called a schema..." },
                            { word: "fill-in", meaning: "채우기, 보완된 정보", options: ["삭제하기", "채우기, 보완된 정보", "반박하기", "질문하기"], hint: "Such fill-ins are examples of truths..." },
                            { word: "recall", meaning: "상기하다, 기억해 내다", options: ["상기하다, 기억해 내다", "잊어버리다", "수정하다", "기록하다"], hint: "When people recall events or places..." },
                            { word: "typical", meaning: "전형적인, 일반적인", options: ["전형적인, 일반적인", "특이한", "희귀한", "일회성의"], hint: "Incorrect details added from typical experiences." },
                            { word: "routine", meaning: "일상, 습관적 동작", options: ["상상", "일상, 습관적 동작", "새로운 경험", "우연한 사고"], hint: "Truths supplied by routine." }
                        ]
                    },
                    {
                        id: "22",
                        title: "22번: 우주 생명체의 가능성 (Life in the Universe)",
                        summary: "우주는 무한하며 액체 상태의 물, 적절한 대기, 적절한 태양이라는 3가지 생명체 존재 조건을 만족하는 행성이 무수히 많을 거라는 지문입니다.",
                        words: [
                            { word: "extend outward", meaning: "바깥으로 확장되다", options: ["안으로 축소되다", "바깥으로 확장되다", "제자리에 멈추다", "회전하다"], hint: "The stars and planets extend outward..." },
                            { word: "atmosphere", meaning: "대기, 공기", options: ["수온", "지형", "대기, 공기", "중력"], hint: "A suitable atmosphere or air and gas." },
                            { word: "coexist", meaning: "공존하다", options: ["지배하다", "공존하다", "경쟁하다", "멸종하다"], hint: "Coexisting with other outer space beings." },
                            { word: "satisfy conditions", meaning: "조건을 충족시키다", options: ["조건을 충족시키다", "조건을 제한하다", "조건을 파기하다", "조건을 연기하다"], hint: "How many planets might satisfy these conditions?" },
                            { word: "remote future", meaning: "먼 미래", options: ["가까운 과거", "현재", "먼 미래", "지나간 세월"], hint: "In the remote future." }
                        ]
                    }
                ]
            },
            {
                setId: 2,
                setTitle: "Set 2: 마케팅 & 환경 (Passages 23, 24, 29)",
                badgeColor: "from-emerald-400 to-teal-600",
                passages: [
                    {
                        id: "23",
                        title: "23번: 타겟별 광고 전략 (Advertising Strategy)",
                        summary: "광고주들은 타겟에 따라 매체(인터넷, 잡지 등)를 다르게 선택하며, 효과를 극대화하기 위해 전문 대행사를 활용합니다.",
                        words: [
                            { word: "appeal to", meaning: "~에 호소하다, 끌다", options: ["~에 호소하다, 끌다", "~을 거부하다", "~을 비판하다", "~에 영향을 받다"], hint: "Magazines often appeal directly to special groups." },
                            { word: "cost-effective", meaning: "비용 효율적인", options: ["비용이 많이 드는", "비용 효율적인", "비효율적인", "품질이 낮은"], hint: "Making them a cost-effective tool for broad outreach." },
                            { word: "outreach", meaning: "지원/홍보 활동, 도달", options: ["내부 통제", "지원/홍보 활동, 도달", "생산 중단", "자본 회수"], hint: "A cost-effective tool for broad outreach." },
                            { word: "hire agencies", meaning: "대행사를 고용하다", options: ["직원을 해고하다", "대행사를 고용하다", "공장을 설립하다", "제품을 직접 판매하다"], hint: "They also hire agencies to survey the markets." },
                            { word: "maximize impact", meaning: "영향력을 극대화하다", options: ["영향력을 축소하다", "영향력을 극대화하다", "비용을 감축하다", "위험을 회피하다"], hint: "To maximize the impact of their campaigns..." }
                        ]
                    },
                    {
                        id: "24",
                        title: "24번: 재활용의 경제적 결정 (Recycling Economics)",
                        summary: "재활용 가능 여부는 기술적 능력이 아닌, 수거/처리 비용보다 폐기물 가치가 높은가라는 '경제성'에 달렸다는 글입니다.",
                        words: [
                            { word: "be tied to", meaning: "~와 결부되다, 관련되다", options: ["~와 결부되다, 관련되다", "~와 무관하다", "~을 완전히 방지하다", "~보다 우월하다"], hint: "The decision to recycle is tied entirely to economics." },
                            { word: "commodity", meaning: "상품, 원자재", options: ["쓰레기", "상품, 원자재", "기술", "기계"], hint: "Five commodities that are readily recycled..." },
                            { word: "readily", meaning: "손쉽게, 기꺼이", options: ["복잡하게", "어렵게", "손쉽게, 기꺼이", "드물게"], hint: "Readily recycled on a global level." },
                            { word: "discarded material", meaning: "폐기된 물질", options: ["재생된 재료", "신소재", "폐기된 물질", "고가의 원료"], hint: "Value of the discarded material." },
                            { word: "technical capacity", meaning: "기술적 능력/수용력", options: ["재정적 한계", "기술적 능력/수용력", "행정적 법률", "환경적 오염"], hint: "Little to do with its technical capacity..." }
                        ]
                    },
                    {
                        id: "29",
                        title: "29번: 쓰레기와 합성 물질 (Natural Harmony)",
                        summary: "자연은 배설물이 다른 생물의 투입물이 되는 순환 조화를 이루나, 인간의 합성물질(플라스틱 등)이 이를 파괴했습니다.",
                        words: [
                            { word: "feces / droppings", meaning: "배설물", options: ["먹이, 영양분", "배설물", "씨앗", "줄기"], hint: "Feces from a fox can become food..." },
                            { word: "synthetic materials", meaning: "합성 물질", options: ["천연 재료", "합성 물질", "유기농 식품", "금속 원소"], hint: "With the creation of synthetic materials..." },
                            { word: "natural harmony", meaning: "자연스러운 조화", options: ["자연 파괴", "인공적 질서", "자연스러운 조화", "생태계 경쟁"], hint: "This natural harmony is rooted in the principle..." },
                            { word: "useful input", meaning: "유용한 투입물", options: ["해로운 유출물", "유용한 투입물", "불필요한 부산물", "복잡한 수식"], hint: "Useful input for other organisms." },
                            { word: "end up as", meaning: "결국 ~이 되다", options: ["결국 ~이 되다", "처음부터 시작하다", "성공적으로 마치다", "중도 포기하다"], hint: "The bird may end up as supper for the fox." }
                        ]
                    }
                ]
            },
            {
                setId: 3,
                setTitle: "Set 3: 물리학 & 심리학 (Passages 30, 31, 32)",
                badgeColor: "from-blue-500 to-indigo-600",
                passages: [
                    {
                        id: "30",
                        title: "30번: 물질의 상태 변화 (States of Matter)",
                        summary: "물질은 고체, 액체, 기체로 존재하며 열에너지의 가감에 따라 물리적 형태가 교체된다는 물질 상태 변화 지문입니다.",
                        words: [
                            { word: "packed closely", meaning: "빽빽하게 뭉쳐진", options: ["느슨하게 흩어진", "빽빽하게 뭉쳐진", "불규칙한", "용해된"], hint: "Particles are packed closely together." },
                            { word: "solidify", meaning: "굳어지다, 응고하다", options: ["증발하다", "굳어지다, 응고하다", "팽창하다", "분해되다"], hint: "Allowing it to solidify and take shape." },
                            { word: "condense", meaning: "응축되다, 기체가 액체화되다", options: ["승화하다", "응축되다", "녹다", "타오르다"], hint: "As heat is lost, a gas condenses into a liquid." },
                            { word: "physical change", meaning: "물리적 변화", options: ["화학적 반응", "물리적 변화", "생물학적 변이", "영구적 파괴"], hint: "These phase changes are physical changes." },
                            { word: "substance", meaning: "물질, 본질", options: ["기체", "에너지", "물질, 본질", "온도"], hint: "Meaning the substance remains the same." }
                        ]
                    },
                    {
                        id: "31",
                        title: "31번: 행동 면역 체계와 혐오 (Behavioral Immune System)",
                        summary: "인간은 감염 위험을 피하고자 혐오(disgust)감을 발달시켰으며, 이는 오탐지(false alarm)를 감수하더라도 생존을 돕습니다.",
                        words: [
                            { word: "infectious disease", meaning: "전염병, 감염성 질환", options: ["유전성 질환", "전염병, 감염성 질환", "만성 피로", "정신적 스트레스"], hint: "One major threat to survival has been infectious disease." },
                            { word: "pathogen", meaning: "병원균, 병원체", options: ["항체", "병원균, 병원체", "백신", "영양소"], hint: "Avoiding potential sources of pathogens." },
                            { word: "disgust", meaning: "혐오감, 메스꺼움", options: ["호기심", "동경", "혐오감, 메스꺼움", "친밀감"], hint: "One such response is disgust..." },
                            { word: "overgeneralize", meaning: "과도하게 일반화하다", options: ["정확히 측정하다", "과도하게 일반화하다", "무시하다", "축소하다"], hint: "It sometimes overgeneralizes and triggers avoidance." },
                            { word: "caution", meaning: "조심, 경계", options: ["무모함", "조심, 경계", "효율성", "낙관주의"], hint: "An evolutionary strategy that favors caution." }
                        ]
                    },
                    {
                        id: "32",
                        title: "32번: 미움받기 싫어하는 상사 (Bad Bosses & Gimmicks)",
                        summary: "모든 직원에게 나쁜 소식을 못 전하고 인기만 얻으려는 리더는 술책(gimmick)에 의존하다 진정한 신뢰를 잃고 자멸한다는 지문입니다.",
                        words: [
                            { word: "abusive", meaning: "모욕적인, 남용하는", options: ["친절한", "모욕적인, 남용하는", "공정한", "겸손한"], hint: "Second only to the abusive cruel boss..." },
                            { word: "lack courage", meaning: "용기가 부족하다", options: ["지혜가 뛰어나다", "용기가 부족하다", "지식이 풍부하다", "인내심이 높다"], hint: "They lack the courage to make hard decisions." },

            initAudio() {
                try {
                    this.synth = new Tone.PolySynth(Tone.Synth).toDestination();
                    this.synth.volume.value = -12;
                } catch(e) {
                    console.log("Audio Init Error", e);
                }
            }

            playBGM() {
                if (!this.bgmPlaying) return;
                const now = Tone.now();
                if (Tone.context.state !== 'running') {
                    Tone.start();
                }
                const notes = ["C4", "E4", "G4", "B4", "G4", "E4", "A4", "C5"];
                notes.forEach((note, index) => {
                    this.synth.triggerAttackRelease(note, "8n", now + index * 0.25);
                });
            }

            toggleBGM() {
                this.bgmPlaying = !this.bgmPlaying;
                const icon = document.getElementById("bgmIcon");
                const btn = document.getElementById("bgmToggle");
                if (this.bgmPlaying) {
                    icon.className = "fa-solid fa-volume-high";
                    btn.classList.add("bg-emerald-500");
                    Tone.start();
                    this.playBGM();
                } else {
                    icon.className = "fa-solid fa-volume-xmark";
                    btn.classList.remove("bg-emerald-500");
                }
            }

            playEffect(type) {
                try {
                    const synth = new Tone.Synth().toDestination();

                        synth.triggerAttackRelease("C5", "8n", Tone.now());
                        synth.triggerAttackRelease("E5", "8n", Tone.now() + 0.1);
                        synth.triggerAttackRelease("G5", "8n", Tone.now() + 0.2);

                        synth.triggerAttackRelease("G3", "8n", Tone.now());

                    q.shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
                });

                this.currentQuizIndex = 0;
                this.renderPassageOverview();
            }

            renderPassageOverview() {
                const set = PASSAGE_SETS[this.currentSetIndex];
                const container = document.getElementById("mainContent");

                container.innerHTML = `
                    <div class="w-full max-w-2xl space-y-4">
                        <div class="bg-amber-100 text-amber-900 p-3.5 rounded-2xl flex items-center gap-3 border border-amber-200">
                            <i class="fa-solid fa-book-open text-2xl text-amber-600"></i>
                            <div>
                                <h3 class="font-black text-base">${set.setTitle} 개요</h3>
                                <p class="text-xs">퀴즈를 시작하기 전 해당 세트에 수록된 지문 핵심 요약을 확인하세요.</p>
                            </div>
                        </div>

                        <div class="space-y-2.5 max-h-[350px] overflow-y-auto pr-1">
                            ${set.passages.map(p => `
                                <div class="bg-white p-3.5 rounded-2xl border-2 border-slate-100 shadow-sm hover:border-amber-300 transition">
                                    <h4 class="font-black text-slate-800 text-sm mb-1 flex items-center gap-2">
                                        <span class="bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded-md">지문</span>
                                        ${p.title}
                                    </h4>
                                    <p class="text-xs text-slate-600 leading-relaxed">${p.summary}</p>
                                    <div class="mt-1.5 text-[11px] font-bold text-amber-600">출제 어휘 수: ${p.words.length}문항</div>
                                </div>
                            `).join('')}
                        </div>

                        <button onclick="app.nextQuestion()" class="w-full btn-bounce bg-emerald-500 hover:bg-emerald-600 text-white font-black p-3.5 rounded-2xl shadow-lg text-base flex items-center justify-center gap-2">
                            <i class="fa-solid fa-bolt"></i> Speed Voca Quiz 시작하기!
                        </button>
                    </div>
                `;
            }

            nextQuestion() {
                if (this.currentQuizIndex >= this.quizQueue.length) {
                    this.finishQuiz();
                    return;
                }

                const q = this.quizQueue[this.currentQuizIndex];
                const container = document.getElementById("mainContent");

                if (this.bgmPlaying) this.playBGM();

                container.innerHTML = `
                    <div class="w-full max-w-2xl space-y-4">
                        <!-- Progress Bar & Timer Header -->
                        <div class="flex justify-between items-center bg-slate-100 p-2.5 px-4 rounded-2xl">
                            <div class="flex items-center gap-2 font-black text-xs text-slate-600">
                                <span class="bg-indigo-600 text-white px-2 py-0.5 rounded-lg">${this.currentQuizIndex + 1} / ${this.quizQueue.length}</span>
                                <span class="hidden sm:inline truncate max-w-[220px]">${q.passageTitle}</span>
                            </div>
                            <!-- Timer Badge -->
                            <div class="flex items-center gap-2 bg-white px-3 py-1 rounded-xl shadow-inner border">
                                <i class="fa-solid fa-clock text-rose-500 text-sm"></i>
                                <span id="timerDisplay" class="font-black text-lg text-slate-800">10</span>s
                            </div>
                            <div class="font-black text-xs sm:text-sm text-emerald-600">
                                점수: <span id="scoreDisplay">${this.score}</span>점
                            </div>
                        </div>

                        <!-- Target Word Card -->
                        <div class="bg-gradient-to-br from-indigo-500 via-purple-600 to-pink-500 text-white p-5 rounded-3xl text-center shadow-xl relative overflow-hidden">
                            <div class="absolute -right-4 -bottom-4 text-white/10 text-8xl font-black select-none">VOCA</div>
                            <span class="text-[10px] bg-white/20 px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wide">Target Word / Phrase</span>
                            <h3 class="text-3xl sm:text-4xl font-black my-2 tracking-wide drop-shadow">${q.word}</h3>
                            <p class="text-xs text-indigo-100 bg-black/20 p-2 rounded-xl inline-block max-w-full italic">💡 Hint: "${q.hint}"</p>
                        </div>

                        <!-- Answer Options -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5" id="optionsContainer">
                            ${q.shuffledOptions.map((opt, i) => `
                                <button onclick="app.checkAnswer('${opt.replace(/'/g, "\\'")}', this)" class="btn-bounce bg-white border-2 border-slate-200 hover:border-indigo-400 text-slate-800 font-black p-3.5 rounded-2xl shadow-sm text-left flex items-center gap-3 transition">
                                    <span class="w-7 h-7 rounded-xl bg-slate-100 text-slate-500 flex items-center justify-center text-xs font-bold shrink-0">${i+1}</span>
                                    <span class="text-sm sm:text-base leading-tight">${opt}</span>
                                </button>
                            `).join('')}
                        </div>

                        <!-- Feedback Overlay / Message -->
                        <div id="feedbackBox" class="hidden p-3 rounded-2xl text-center font-black text-base shadow-lg animate-bounce"></div>
                    </div>
                `;

                this.startTimer();
            }

            startTimer() {
                clearInterval(this.timer);
                this.timeLeft = 10;
                const display = document.getElementById("timerDisplay");

                this.timer = setInterval(() => {
                    this.timeLeft--;
                    if (display) {
                        display.innerText = this.timeLeft;
                        if (this.timeLeft <= 3) {
                            display.parentElement.classList.add("pulse-timer");
                        }
                    }

                    if (this.timeLeft <= 0) {
                        clearInterval(this.timer);
                        this.handleTimeout();
                    }
                }, 1000);
            }

            handleTimeout() {
                this.playEffect('wrong');
                this.disableOptions();
                const q = this.quizQueue[this.currentQuizIndex];

                const feedback = document.getElementById("feedbackBox");
                feedback.className = "p-3 rounded-2xl text-center font-black text-sm bg-rose-500 text-white shadow-lg";
                feedback.innerHTML = `<i class="fa-solid fa-hourglass-end"></i> 시간 초과! 정답은 [${q.meaning}] 입니다.`;
                feedback.classList.remove("hidden");

                setTimeout(() => {
                    this.currentQuizIndex++;
                    this.nextQuestion();
                }, 2000);
            }

            checkAnswer(selectedOption, btnEl) {
                clearInterval(this.timer);
                this.disableOptions();

                const q = this.quizQueue[this.currentQuizIndex];
                const isCorrect = selectedOption === q.meaning;
                const feedback = document.getElementById("feedbackBox");

                if (isCorrect) {
                    this.score += 10;
                    this.playEffect('correct');
                    btnEl.classList.remove("bg-white", "border-slate-200");
                    btnEl.classList.add("bg-emerald-500", "text-white", "border-emerald-600");

                    try {
                        confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
                    } catch(e){}

                    const randomPraise = PRAISES[Math.floor(Math.random() * PRAISES.length)];
                    feedback.className = "p-3.5 rounded-2xl text-center font-black text-base bg-emerald-500 text-white shadow-lg animate-bounce";
                    feedback.innerHTML = `${randomPraise}`;
                } else {
                    this.playEffect('wrong');
                    btnEl.classList.remove("bg-white", "border-slate-200");
                    btnEl.classList.add("bg-rose-500", "text-white", "border-rose-600");

                    feedback.className = "p-3 rounded-2xl text-center font-black text-sm bg-rose-100 text-rose-700 border-2 border-rose-300 shadow-lg";
                    feedback.innerHTML = `아쉽네요! 정답은 <strong>[${q.meaning}]</strong> 입니다.`;
                }

                feedback.classList.remove("hidden");

                setTimeout(() => {
                    this.currentQuizIndex++;
                    this.nextQuestion();
                }, 1800);
            }

            disableOptions() {
                const container = document.getElementById("optionsContainer");
                if (container) {
                    const buttons = container.querySelectorAll("button");
                    buttons.forEach(btn => btn.disabled = true);
                }
            }

            finishQuiz() {
                clearInterval(this.timer);
                const totalQuestions = this.quizQueue.length;
                const maxScore = totalQuestions * 10;
                const percentage = Math.round((this.score / maxScore) * 100);

                // Save student record
                const newRecord = {
                    name: this.studentName,
                    setTitle: PASSAGE_SETS[this.currentSetIndex].setTitle,
                    score: this.score,
                    maxScore: maxScore,
                    percentage: percentage,
                    date: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
                };

                this.studentList.unshift(newRecord);
                localStorage.setItem("voca_students_v2", JSON.stringify(this.studentList));

                const container = document.getElementById("mainContent");
                container.innerHTML = `
                    <div class="text-center w-full max-w-md space-y-5 py-2">
                        <div class="inline-block p-4 bg-amber-300 text-slate-800 rounded-full text-4xl shadow-xl animate-bounce">
                            🏆
                        </div>
                        <h2 class="text-2xl sm:text-3xl font-black text-slate-800">세트 학습 완료!</h2>
                        <p class="text-slate-600 font-bold text-sm">${this.studentName} 학생, 수고하셨습니다!</p>

                        <div class="bg-slate-50 p-5 rounded-3xl border-2 border-slate-200 space-y-2.5">
                            <div class="text-xs font-black text-slate-400 uppercase tracking-widest">최종 성적 결과</div>
                            <div class="text-4xl font-black text-indigo-600">${this.score} <span class="text-lg text-slate-400">/ ${maxScore}점</span></div>
                            <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
                                <div class="bg-indigo-500 h-full rounded-full transition-all duration-1000" style="width: ${percentage}%"></div>
                            </div>
                            <div class="text-xs font-bold text-slate-500">정답률: ${percentage}%</div>
                        </div>

                        <div class="flex gap-3">
                            <button onclick="app.goHome()" class="flex-1 btn-bounce bg-slate-200 hover:bg-slate-300 text-slate-700 font-black p-3.5 rounded-2xl shadow transition text-sm">
                                메인으로
                            </button>
                            <button onclick="app.startSet(${this.currentSetIndex})" class="flex-1 btn-bounce bg-amber-400 hover:bg-amber-500 text-slate-800 font-black p-3.5 rounded-2xl shadow transition text-sm">
                                다시 도전
                            </button>
                        </div>
                    </div>
                `;

                try {
                    confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });
                } catch(e){}
            }

            openTeacherModal() {
                const modal = document.getElementById("teacherModal");
                const listContainer = document.getElementById("teacherStudentList");
                const countText = document.getElementById("totalParticipantsText");

                listContainer.innerHTML = "";

                if (this.studentList.length === 0) {
                    listContainer.innerHTML = `
                        <div class="text-center py-12 text-slate-400">
                            <i class="fa-solid fa-folder-open text-4xl mb-2"></i>
                            <p class="font-bold text-sm">아직 풀이를 제출한 학생 기록이 없습니다.</p>
                        </div>
                    `;
                } else {
                    this.studentList.forEach(st => {
                        const card = document.createElement("div");
                        card.className = "bg-slate-50 p-3.5 rounded-2xl border border-slate-200 flex justify-between items-center hover:bg-indigo-50/50 transition";
                        card.innerHTML = `
                            <div>
                                <div class="font-black text-slate-800 text-sm flex items-center gap-2">
                                    <i class="fa-solid fa-user-graduate text-indigo-500"></i>
                                    ${st.name}
                                    <span class="text-[10px] font-normal text-slate-400">(${st.date})</span>
                                </div>
                                <div class="text-xs text-slate-500 mt-0.5">${st.setTitle}</div>
                            </div>
                            <div class="text-right">
                                <span class="font-black text-base ${st.percentage >= 80 ? 'text-emerald-600' : 'text-amber-600'}">${st.score}점</span>
                                <span class="text-xs text-slate-400 block">(${st.percentage}%)</span>
                            </div>
                        `;
                        listContainer.appendChild(card);
                    });
                }

                countText.innerText = `총 제출 기록: ${this.studentList.length}건`;
                modal.classList.remove("hidden");
            }

            closeTeacherModal() {
                document.getElementById("teacherModal").classList.add("hidden");
            }

            resetTeacherData() {
                if (confirm("모든 학생들의 학습 기록을 삭제 초기화하시겠습니까?")) {
                    this.studentList = [];
                    localStorage.removeItem("voca_students_v2");
                    this.openTeacherModal();
                }
            }
        }

        let app;
        window.onload = () => {
            app = new VocaApp();
            app.goHome();
        };
    </script>
</body>
</html>
